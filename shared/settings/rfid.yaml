rfid:
  readers:
    read_00:
      module: rc522_spi
      config:
        spi_bus: 0
        spi_ce: 0
        pin_irq: 24
        pin_rst: 22
        mode_legacy: false
        antenna_gain: 7
        log_all_cards: true
      same_id_delay: 1.0
      allow_no_card_id_for_iterations: 0
      log_ignored_cards: false
      place_not_swipe:
        enabled: true
        card_removal_action:
          alias: pause
